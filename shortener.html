<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Extender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a0820;
    --bg-2: #1a1040;
    --violet: #7b5cff;
    --blue: #4f8bff;
    --neon: #a58bff;
    --text: #e8e6ff;
    --muted: #9b95c9;
    --card: rgba(30, 22, 80, 0.55);
    --border: rgba(123, 92, 255, 0.45);
    --ok: #5ef2c4;
    --err: #ff7ab8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-1) 70%);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    padding: 40px 20px 90px;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(123, 92, 255, 0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123, 92, 255, 0.12) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    animation: drift 20s linear infinite;
    pointer-events: none; z-index: 0;
  }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(48px); } }

  .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.45; pointer-events: none; z-index: 0; }
  .orb-1 { width: 380px; height: 380px; background: var(--violet); top: -120px; left: -100px; }
  .orb-2 { width: 320px; height: 320px; background: var(--blue); bottom: -120px; right: -80px; }

  .container { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }

  .back {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 30px;
    transition: color 0.2s;
  }
  .back:hover { color: var(--neon); }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(34px, 6vw, 56px);
    letter-spacing: 4px;
    background: linear-gradient(90deg, #c7b8ff, var(--violet), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(123, 92, 255, 0.35);
    margin-bottom: 10px;
  }
  .subtitle { color: var(--muted); font-size: 17px; letter-spacing: 1px; margin-bottom: 36px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(123, 92, 255, 0.15);
  }

  label {
    display: block;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .input-row { display: flex; gap: 12px; flex-wrap: wrap; }
  input[type="url"] {
    flex: 1 1 320px;
    min-width: 0;
    background: rgba(10, 8, 32, 0.7);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: var(--neon); box-shadow: 0 0 20px rgba(123, 92, 255, 0.45); }
  input::placeholder { color: #6e68a0; }

  button.primary, button.ghost {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 12px;
    padding: 14px 24px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    color: var(--text);
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  button.primary {
    border: none;
    background: linear-gradient(90deg, var(--violet), var(--blue));
    box-shadow: 0 0 22px rgba(123, 92, 255, 0.5);
  }
  button.primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 34px rgba(123, 92, 255, 0.8); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
  }
  button.ghost:hover:not(:disabled) { border-color: var(--neon); box-shadow: 0 0 16px rgba(123, 92, 255, 0.4); }

  .hint { margin-top: 14px; font-size: 15px; color: var(--muted); }
  .msg { margin-top: 14px; min-height: 22px; font-size: 16px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }

  .result {
    display: none;
    margin-top: 22px;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid var(--blue);
    background: rgba(79, 139, 255, 0.08);
    box-shadow: 0 0 26px rgba(79, 139, 255, 0.35);
  }
  .result.show { display: block; }
  .short-link {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    color: #c7b8ff;
    word-break: break-all;
    margin-bottom: 14px;
  }
  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .history { margin-top: 40px; }
  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .history-title { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .item-info { min-width: 0; flex: 1 1 260px; }
  .item-short { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--neon); word-break: break-all; }
  .item-orig { font-size: 14px; color: var(--muted); word-break: break-all; margin-top: 4px; }
  .item-actions { display: flex; gap: 8px; }
  .item-actions button { padding: 9px 14px; font-size: 11px; }
  .empty { color: var(--muted); font-size: 16px; }

  .credit {
    position: fixed; right: 24px; bottom: 20px; z-index: 2;
    font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px;
    color: #c7b8ff;
    text-shadow: 0 0 6px rgba(123, 92, 255, 0.9), 0 0 14px rgba(79, 139, 255, 0.7), 0 0 26px rgba(123, 92, 255, 0.5);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; text-shadow: 0 0 10px rgba(123, 92, 255, 1), 0 0 22px rgba(79, 139, 255, 0.9), 0 0 36px rgba(123, 92, 255, 0.6); }
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="container">
    <a class="back" href="index.html">&larr; BACK TO SERVICES</a>
    <h1>URL EXTENDER</h1>
    <p class="subtitle">Paste a YouTube, Facebook or Instagram link to shorten it.</p>

    <section class="panel">
      <label for="longUrl">Paste your link</label>
      <div class="input-row">
        <input id="longUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <button class="primary" id="shortenBtn">Shorten</button>
      </div>
      <div class="hint">Supported: YouTube videos &amp; shorts, Facebook videos &amp; reels, Instagram posts &amp; reels.</div>
      <div class="msg" id="msg"></div>

      <div class="result" id="result">
        <div class="short-link" id="shortLink"></div>
        <div class="result-actions">
          <button class="primary" id="copyBtn">Copy link</button>
          <button class="ghost" id="openBtn">Open</button>
        </div>
      </div>
    </section>

    <section class="history">
      <div class="history-head">
        <div class="history-title">Recent links</div>
        <button class="ghost" id="clearBtn">Clear all</button>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <div class="credit">Made by MasterX9</div>

<script>
  const STORAGE_KEY = 'mx_short_links_v2';
  const ALLOWED_HOSTS = ['youtube.com', 'youtu.be', 'facebook.com', 'fb.watch', 'fb.com', 'instagram.com'];
  // Paste your Cloudflare Worker URL here after deploying worker.js
  const SHORTEN_API = 'https://masterxiao-31a6.therahmans02.workers.dev/';

  const $ = id => document.getElementById(id);
  const input = $('longUrl');
  const msg = $('msg');
  const result = $('result');
  const shortLinkEl = $('shortLink');
  const shortenBtn = $('shortenBtn');
  let lastShort = '';

  function loadLinks() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveLinks(links) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(links)); } catch (e) {}
  }

  function isAllowed(url) {
    let u;
    try { u = new URL(url); } catch (e) { return false; }
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    return ALLOWED_HOSTS.some(h => host === h || host.endsWith('.' + h));
  }

  function setMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  // Calls the public is.gd API using JSONP (works from a plain web page, no CORS problem)
  function jsonpShorten(service, longUrl) {
    return new Promise((resolve, reject) => {
      const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      const script = document.createElement('script');
      const cleanup = () => { delete window[cbName]; script.remove(); clearTimeout(timer); };
      const timer = setTimeout(() => { cleanup(); reject(new Error(service + ' timed out')); }, 15000);

      window[cbName] = data => {
        cleanup();
        if (data && data.shorturl) resolve(data.shorturl);
        else reject(new Error(service + ': ' + ((data && data.errormessage) || 'no short link returned')));
      };
      script.onerror = () => { cleanup(); reject(new Error(service + ' could not be reached (blocked or offline)')); };
      script.src = 'https://' + service + '/create.php?format=json&callback=' + cbName +
                   '&url=' + encodeURIComponent(longUrl);
      document.body.appendChild(script);
    });
  }

  // Direct request: reads the JSON answer as data (works if the service allows it)
  async function fetchShorten(service, longUrl) {
    const res = await fetch('https://' + service + '/create.php?format=json&url=' + encodeURIComponent(longUrl));
    const data = await res.json();
    if (data && data.shorturl) return data.shorturl;
    throw new Error(service + ': ' + ((data && data.errormessage) || 'no short link returned'));
  }

  // Asks our own Worker to shorten the link (the Worker calls is.gd / v.gd for us)
  async function requestShortLink(longUrl) {
    const res = await fetch(SHORTEN_API + '?url=' + encodeURIComponent(longUrl));
    const data = await res.json();
    if (!res.ok || !data.shorturl) throw new Error(data.error || 'Shortening failed.');
    return data.shorturl;
  }

  async function shorten() {
    const url = input.value.trim();
    if (!url) { setMsg('Please paste a link first.', 'err'); result.classList.remove('show'); return; }
    if (!isAllowed(url)) {
      setMsg('Only YouTube, Facebook and Instagram links are accepted.', 'err');
      result.classList.remove('show');
      return;
    }

    const links = loadLinks();
    const existing = links.find(l => l.url === url);
    if (existing) {
      showResult(existing.short);
      setMsg('This link was already shortened.', 'ok');
      return;
    }

    shortenBtn.disabled = true;
    setMsg('Shortening...', '');
    try {
      const short = await requestShortLink(url);
      links.unshift({ url, short, created: Date.now() });
      saveLinks(links);
      renderList();
      showResult(short);
      setMsg('Link shortened!', 'ok');
    } catch (e) {
      result.classList.remove('show');
      setMsg('Could not shorten this link. ' + e.message, 'err');
    } finally {
      shortenBtn.disabled = false;
    }
  }

  function showResult(short) {
    lastShort = short;
    shortLinkEl.textContent = short;
    result.classList.add('show');
  }

  function copyText(text, btn) {
    const done = () => {
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = old, 1500);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }

  function renderList() {
    const links = loadLinks();
    const list = $('list');
    list.innerHTML = '';
    if (!links.length) {
      list.innerHTML = '<div class="empty">No links yet. Your shortened links will appear here.</div>';
      return;
    }
    links.forEach(l => {
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="item-info">
          <div class="item-short"></div>
          <div class="item-orig"></div>
        </div>
        <div class="item-actions">
          <button class="ghost copy">Copy</button>
          <button class="ghost del">Delete</button>
        </div>`;
      item.querySelector('.item-short').textContent = l.short;
      item.querySelector('.item-orig').textContent = l.url;
      item.querySelector('.copy').addEventListener('click', e => copyText(l.short, e.target));
      item.querySelector('.del').addEventListener('click', () => {
        saveLinks(loadLinks().filter(x => x.url !== l.url));
        renderList();
      });
      list.appendChild(item);
    });
  }

  shortenBtn.addEventListener('click', shorten);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });
  $('copyBtn').addEventListener('click', e => copyText(lastShort, e.target));
  $('openBtn').addEventListener('click', () => window.open(lastShort, '_blank'));
  $('clearBtn').addEventListener('click', () => {
    if (confirm('Delete all saved links?')) { saveLinks([]); renderList(); }
  });

  renderList();
</script>
</body>
</html>
